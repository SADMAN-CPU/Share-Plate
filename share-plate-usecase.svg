<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="750" fill="#f5f5f5"/>

  <!-- System Boundary Box -->
  <rect x="150" y="30" width="780" height="690" rx="6" ry="6" fill="white" stroke="#555" stroke-width="2"/>
  <text x="540" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Share-Plate a Food Sharing Platform</text>

  <!-- ===== ACTORS ===== -->
  <!-- Donor -->
  <circle cx="72" cy="110" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="128" x2="72" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="42" y1="148" x2="102" y2="148" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="175" x2="48" y2="205" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="175" x2="96" y2="205" stroke="#333" stroke-width="2"/>
  <text x="72" y="222" text-anchor="middle" font-size="13" fill="#333">Donor</text>

  <!-- Receiver -->
  <circle cx="72" cy="340" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="358" x2="72" y2="405" stroke="#333" stroke-width="2"/>
  <line x1="42" y1="378" x2="102" y2="378" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="405" x2="48" y2="435" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="405" x2="96" y2="435" stroke="#333" stroke-width="2"/>
  <text x="72" y="452" text-anchor="middle" font-size="13" fill="#333">Receiver</text>

  <!-- Volunteer -->
  <circle cx="72" cy="555" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="573" x2="72" y2="620" stroke="#333" stroke-width="2"/>
  <line x1="42" y1="593" x2="102" y2="593" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="620" x2="48" y2="650" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="620" x2="96" y2="650" stroke="#333" stroke-width="2"/>
  <text x="72" y="667" text-anchor="middle" font-size="13" fill="#333">Volunteer</text>

  <!-- Admin -->
  <circle cx="1028" cy="340" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="1028" y1="358" x2="1028" y2="405" stroke="#333" stroke-width="2"/>
  <line x1="998" y1="378" x2="1058" y2="378" stroke="#333" stroke-width="2"/>
  <line x1="1028" y1="405" x2="1004" y2="435" stroke="#333" stroke-width="2"/>
  <line x1="1028" y1="405" x2="1052" y2="435" stroke="#333" stroke-width="2"/>
  <text x="1028" y="452" text-anchor="middle" font-size="13" fill="#333">Admin</text>

  <!-- ===== USE CASES ===== -->

  <!-- Log In (green) -->
  <ellipse cx="290" cy="100" rx="80" ry="28" fill="#b2dfdb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Log In</text>

  <!-- Register (green) -->
  <ellipse cx="460" cy="100" rx="70" ry="28" fill="#a5d6a7" stroke="#555" stroke-width="1.5"/>
  <text x="460" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Register</text>

  <!-- Food Listing & Management (green) -->
  <ellipse cx="290" cy="185" rx="100" ry="28" fill="#b2dfdb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Food Listing &amp;</text>
  <text x="290" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Management</text>

  <!-- Upload Photo -->
  <ellipse cx="470" cy="155" rx="68" ry="24" fill="#f3e5f5" stroke="#aaa" stroke-width="1"/>
  <text x="470" y="159" text-anchor="middle" font-size="11" fill="#444">Upload Photo</text>

  <!-- Set Expiry Date -->
  <ellipse cx="470" cy="210" rx="68" ry="24" fill="#f3e5f5" stroke="#aaa" stroke-width="1"/>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#444">Set Expiry Date</text>

  <!-- Add Description -->
  <ellipse cx="470" cy="262" rx="68" ry="24" fill="#f3e5f5" stroke="#aaa" stroke-width="1"/>
  <text x="470" y="266" text-anchor="middle" font-size="11" fill="#444">Add Description</text>

  <!-- View Impact Dashboard (green) -->
  <ellipse cx="290" cy="300" rx="100" ry="28" fill="#b2dfdb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">View Impact</text>
  <text x="290" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Dashboard</text>

  <!-- Search & Browse Map (blue) -->
  <ellipse cx="290" cy="380" rx="100" ry="28" fill="#bbdefb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Search &amp; Browse</text>
  <text x="290" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Map</text>

  <!-- Request Food (blue) -->
  <ellipse cx="290" cy="460" rx="80" ry="28" fill="#bbdefb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Request Food</text>

  <!-- Rate Food & Service (blue) -->
  <ellipse cx="290" cy="560" rx="95" ry="28" fill="#bbdefb" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Rate Food &amp;</text>
  <text x="290" y="571" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Service</text>

  <!-- Donation Tracking & Logistics (yellow/orange) -->
  <ellipse cx="500" cy="410" rx="110" ry="30" fill="#fff9c4" stroke="#bbb" stroke-width="1.5"/>
  <text x="500" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Donation Tracking &amp;</text>
  <text x="500" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Logistics</text>

  <!-- Update Delivery Status (yellow) -->
  <ellipse cx="500" cy="488" rx="90" ry="24" fill="#fff9c4" stroke="#bbb" stroke-width="1"/>
  <text x="500" y="492" text-anchor="middle" font-size="11" fill="#555">Update Delivery Status</text>

  <!-- Accept Pickup (yellow) -->
  <ellipse cx="500" cy="545" rx="75" ry="24" fill="#fff9c4" stroke="#bbb" stroke-width="1"/>
  <text x="500" y="549" text-anchor="middle" font-size="11" fill="#555">Accept Pickup</text>

  <!-- RIGHT SIDE: Admin area box -->
  <rect x="660" y="120" width="250" height="330" rx="6" ry="6" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Send Notification & Alert (purple) -->
  <ellipse cx="780" cy="158" rx="105" ry="28" fill="#e1bee7" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="780" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Send Notification &amp;</text>
  <text x="780" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Alert</text>

  <!-- Administrative Oversight (purple) -->
  <ellipse cx="780" cy="255" rx="105" ry="28" fill="#d1c4e9" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="780" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Administrative</text>
  <text x="780" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Oversight</text>

  <!-- Verify Users (lavender) -->
  <ellipse cx="780" cy="335" rx="85" ry="25" fill="#e8eaf6" stroke="#9b59b6" stroke-width="1"/>
  <text x="780" y="339" text-anchor="middle" font-size="11" fill="#333">Verify Users</text>

  <!-- Manage Listings (lavender) -->
  <ellipse cx="780" cy="395" rx="85" ry="25" fill="#e8eaf6" stroke="#9b59b6" stroke-width="1"/>
  <text x="780" y="399" text-anchor="middle" font-size="11" fill="#333">Manage Listings</text>

  <!-- Monitor Expiry Alerts (pink) -->
  <ellipse cx="780" cy="530" rx="90" ry="26" fill="#fce4ec" stroke="#e91e63" stroke-width="1.2"/>
  <text x="780" y="534" text-anchor="middle" font-size="11" fill="#880e4f">Monitor Expiry Alerts</text>

  <!-- ===== CONNECTIONS ===== -->

  <!-- Donor -> Log In -->
  <line x1="90" y1="118" x2="210" y2="105" stroke="#333" stroke-width="1.4"/>
  <!-- Donor -> Food Listing -->
  <line x1="90" y1="130" x2="190" y2="175" stroke="#333" stroke-width="1.4"/>
  <!-- Donor -> View Impact -->
  <line x1="90" y1="140" x2="190" y2="285" stroke="#333" stroke-width="1.4"/>

  <!-- Receiver -> View Impact -->
  <line x1="90" y1="338" x2="190" y2="305" stroke="#333" stroke-width="1.4"/>
  <!-- Receiver -> Search & Browse -->
  <line x1="90" y1="348" x2="190" y2="375" stroke="#333" stroke-width="1.4"/>
  <!-- Receiver -> Request Food -->
  <line x1="90" y1="360" x2="210" y2="450" stroke="#333" stroke-width="1.4"/>
  <!-- Receiver -> Rate Food -->
  <line x1="90" y1="370" x2="195" y2="545" stroke="#333" stroke-width="1.4"/>

  <!-- Volunteer -> Donation Tracking -->
  <line x1="90" y1="560" x2="390" y2="425" stroke="#333" stroke-width="1.4"/>
  <!-- Volunteer -> Rate Food -->
  <line x1="90" y1="570" x2="195" y2="565" stroke="#333" stroke-width="1.4"/>

  <!-- Log In <<extend>> Register -->
  <line x1="370" y1="100" x2="390" y2="100" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="378" y="94" text-anchor="middle" font-size="8" fill="#666">«extend»</text>
  <polygon points="390,100 383,96 383,104" fill="#888"/>

  <!-- Food Listing <<include>> Upload Photo -->
  <line x1="387" y1="176" x2="402" y2="163" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="388" y="162" font-size="8" fill="#666">«include»</text>
  <polygon points="402,163 394,162 396,170" fill="#888"/>

  <!-- Food Listing <<include>> Set Expiry Date -->
  <line x1="390" y1="186" x2="402" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="388" y="204" font-size="8" fill="#666">«include»</text>
  <polygon points="402,210 394,206 397,214" fill="#888"/>

  <!-- Food Listing <<include>> Add Description -->
  <line x1="387" y1="193" x2="402" y2="255" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="377" y="238" font-size="8" fill="#666">«include»</text>
  <polygon points="402,255 394,250 396,258" fill="#888"/>

  <!-- Search & Browse <<extend>> Donation Tracking -->
  <line x1="390" y1="385" x2="390" y2="410" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="394" y="398" font-size="8" fill="#666">«extend»</text>
  <polygon points="390,410 386,402 394,402" fill="#888"/>

  <!-- Request Food <<include>> Donation Tracking -->
  <line x1="370" y1="450" x2="390" y2="425" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="362" y="440" font-size="8" fill="#666">«include»</text>
  <polygon points="390,425 382,426 385,434" fill="#888"/>

  <!-- Donation Tracking <<include>> Update Delivery -->
  <line x1="500" y1="440" x2="500" y2="464" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="504" y="452" font-size="8" fill="#666">«include»</text>
  <polygon points="500,464 496,456 504,456" fill="#888"/>

  <!-- Donation Tracking <<include>> Accept Pickup -->
  <line x1="490" y1="440" x2="480" y2="521" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="462" y="490" font-size="8" fill="#666">«include»</text>
  <polygon points="480,521 476,513 484,514" fill="#888"/>

  <!-- Search & Browse <<extend>> Send Notification -->
  <line x1="390" y1="372" x2="675" y2="163" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="520" y="258" font-size="8" fill="#666">«extend»</text>
  <polygon points="675,163 668,165 670,157" fill="#888"/>

  <!-- Donation Tracking -> Send Notification -->
  <line x1="610" y1="405" x2="675" y2="175" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <polygon points="675,175 668,177 670,169" fill="#888"/>

  <!-- Admin Oversight <<include>> Verify Users -->
  <line x1="780" y1="283" x2="780" y2="310" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="784" y="298" font-size="8" fill="#666">«include»</text>
  <polygon points="780,310 776,302 784,302" fill="#888"/>

  <!-- Admin Oversight <<include>> Manage Listings -->
  <line x1="800" y1="280" x2="820" y2="370" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="812" y="325" font-size="8" fill="#666">«include»</text>
  <polygon points="820,370 814,363 822,362" fill="#888"/>

  <!-- Manage Listings <<extend>> Monitor Expiry -->
  <line x1="780" y1="420" x2="780" y2="504" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="784" y="464" font-size="8" fill="#666">«extend»</text>
  <polygon points="780,504 776,496 784,496" fill="#888"/>

  <!-- Rate Food <<extend>> Send Notification -->
  <line x1="380" y1="552" x2="675" y2="168" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <polygon points="675,168 669,170 671,162" fill="#888"/>

  <!-- Admin -> Send Notification -->
  <line x1="1010" y1="330" x2="885" y2="165" stroke="#333" stroke-width="1.4"/>
  <!-- Admin -> Admin Oversight -->
  <line x1="1010" y1="348" x2="885" y2="255" stroke="#333" stroke-width="1.4"/>
  <!-- Admin -> Monitor Expiry -->
  <line x1="1010" y1="360" x2="870" y2="530" stroke="#333" stroke-width="1.4"/>
  <!-- Admin -> Manage Listings -->
  <line x1="1010" y1="365" x2="865" y2="395" stroke="#333" stroke-width="1.4"/>

</svg>
